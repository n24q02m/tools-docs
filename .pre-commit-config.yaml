default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit, commit-msg]
# Pre-commit Hooks Configuration
# Installation: https://pre-commit.com/
#
# Quick start:
#   1. Install the toolchain and the hooks: mise run setup
#   2. Run manually: pre-commit run --all-files

repos:
  # ============================================================================
  # Security: Secret Detection (MUST be first — blocks commit if secrets found)
  # ============================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (detect secrets)

  # ============================================================================
  # Common Checks
  # ============================================================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # v5.0.0
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        exclude_types: [image]

      - id: check-merge-conflict
        name: check for merge conflicts

      - id: check-json
        name: check JSON files
        types: [json]

      - id: check-yaml
        name: check YAML files
        types: [yaml]

      - id: check-toml
        name: check TOML files
        types: [toml]

      - id: end-of-file-fixer
        name: fix end of files
        exclude_types: [image]

  # ============================================================================
  # Workflows: ci.yml + cd.yml on hosted runners, started only from a dispatch
  # (plus push/pull_request/merge_group on the public ci.yml). language: python
  # because the lint needs PyYAML, which a bare system python does not carry.
  # ============================================================================
  - repo: local
    hooks:
      - id: ci-policy
        name: Workflows are ci.yml + cd.yml on hosted runners
        entry: python scripts/repo-bootstrap/ci_policy_lint.py
        language: python
        additional_dependencies: [pyyaml]
        files: ^\.github/workflows/.*\.ya?ml$
        args: [--visibility, "public"]

  # ============================================================================
  # Commit Message Enforcement
  # ============================================================================
  - repo: local
    hooks:
      - id: enforce-commit
        name: Enforce feat and fix commit prefixes
        entry: bash scripts/enforce-commit.sh
        language: system
        stages: [commit-msg]
      - id: no-direct-push-to-default
        name: Refuse a direct push to the default branch
        entry: bash scripts/no-direct-push.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
