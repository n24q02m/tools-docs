allowBuilds:
  esbuild: true
  workerd: true
overrides:
  smol-toml: '>=1.9.0'
  source-map-js: '>=1.2.2'
  postcss-selector-parser: '>=7.1.6'
  unifont>undici: '>=8.12.2'
  astro>zod: '>=4.6.6'
  '@astrojs/sitemap>zod': '>=4.6.6'
  satteri: 0.11.7
  '@bruits/satteri-win32-x64-msvc': 0.11.7
# Hold new releases for 7 days (in minutes), the hold renovate.json puts on every
# update, so the `pnpm install` that Renovate's artifact step runs locks the versions
# Renovate proposes instead of releases younger than the hold.
minimumReleaseAge: 10080
