# Scaffold files this repo keeps as its own (read by repo-bootstrap apply.py).

[[exempt]]
path = ".github/ISSUE_TEMPLATE/bug_report.md"
reason = """
A bug here is a wrong or broken page on the docs portal. The report asks for the page
URL and the reader's environment as `- Browser:` (e.g. Firefox 140) and `- OS:`. The
shared TypeScript template asks for a Node.js version, a package version and an
npx/Docker/local-build install method, and has no Page URL section and no Browser line.
"""

[[exempt]]
path = "CONTRIBUTING.md"
reason = """
The shared template tells contributors to run `mise run lint` and `mise run test` and
requires tests with >=95% coverage. This repo is an Astro docs site with no lint task.
Its only tests cover `scripts/sync-sources.mjs`, the script that compiles the skret
docs, and `pnpm test` fails below 95% line, branch or function coverage of it. CI runs
those tests, checks that `pnpm run build` succeeds and runs CodeQL. The steps here name
the `mise run test`, `mise run build` and `mise run dev` tasks that exist in `.mise.toml`.
"""
