name: Create docs.n24q02m.com CNAME (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-cname:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create CNAME docs.n24q02m.com -> mcp-n24q02m.pages.dev
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: d3d79502dd22074b08074c95f405e660
        run: |
          set -e
          # Idempotent: skip if record already exists
          existing=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=docs.n24q02m.com&type=CNAME" \
            -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import json,sys; print(len(json.load(sys.stdin).get('result') or []))")
          if [ "$existing" != "0" ]; then
            echo "CNAME already exists — skipping"
            exit 0
          fi
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"CNAME","name":"docs.n24q02m.com","content":"mcp-n24q02m.pages.dev","proxied":true,"ttl":1}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('success:', d.get('success')); r=d.get('result') or {}; print(r.get('name'), '->', r.get('content'), 'proxied:', r.get('proxied')); sys.exit(0 if d.get('success') else 1)"
