name: CD
on:
  workflow_dispatch:
permissions:
  contents: read
# ci-policy: allow concurrency reason: serialize deploys, never cancel one mid-publish
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tools-n24q02m --branch=main

  # Retired: this CD used to fire a `tools-docs-sync` repository_dispatch at
  # n24q02m/claude-plugins so that repo would rebuild and redeploy the
  # `mcp-n24q02m` Pages hub with inlined tools-docs content. That hub and its
  # deploy job are gone -- docs.n24q02m.com is served straight from this
  # repo's own deploy above (Pages project tools-n24q02m), so a tools-docs
  # publish needs no downstream notification. Do not re-add the dispatch.
